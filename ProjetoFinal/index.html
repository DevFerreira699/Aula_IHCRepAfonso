<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <section> <!--Começo: Navegação-->
      <form>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
          <div class="container-fluid">
            <a class="navbar-brand" href="#">Navegação</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
              aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">características</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="#">preços</a>
                </li>
                <li class="nav-item dropdown">
                  <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                    aria-expanded="false">
                    Link suspenso
                  </a>
                  <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Ação</a></li>
                    <li><a class="dropdown-item" href="#">Outras Ações</a></li>
                    <li><a class="dropdown-item" href="#">Outra coisa aqui</a></li>
                  </ul>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </form>
    </section> <!--Fim: Nevegação-->

  </header>
  <main>
    <section> <!--Começo: Carrossel-->
      <form>
        <div id="carouselExample" class="carousel slide">
          <div class="carousel-inner">
            <div class="carousel-item active">
              <img src="assets/azul.png" class="d-block w-100" alt="Azul">
            </div>
            <div class="carousel-item">
              <img src="assets/vermelho.png" class="d-block w-100" alt="vermelho">
            </div>
            <div class="carousel-item">
              <img src="assets/verde.png" class="d-block w-100" alt="...">
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Proximo</span>
          </button>
        </div>
      </form>
    </section> <!--Fim: Carrossel-->

    <section> <!--Começo: Cards-->
      <form>
        <div class="card" style="width: 18rem;">
          <img src="assets/lakers.png" class="card-img-top" alt="lakers">
          <div class="card-body">
            <h5 class="card-title">Melhor time do basquete</h5>
            <p class="card-text">Campeão de 17 titulos</p>
            <a href="https://lakersbrasil.com" class="btn btn-primary">Saiba mais</a>
          </div>
        </div>
      </form>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </main>

</body>

</html>
